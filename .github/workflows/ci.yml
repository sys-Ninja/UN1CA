name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  daemon:
    name: Build daemons
    needs: shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build vc_daemon
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build_vc_daemon.sh

      - name: Build ca_daemon
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build_ca_daemon.sh

      - name: Upload vc_daemon
        uses: actions/upload-artifact@v4
        with:
          name: vc_daemon
          path: target/a52sxq/patches/00_voicechanger/system/bin/vc_daemon
          if-no-files-found: error

      - name: Upload ca_daemon
        uses: actions/upload-artifact@v4
        with:
          name: ca_daemon
          path: target/a52sxq/patches/01_callai/system/bin/ca_daemon
          if-no-files-found: error

  downloader:
    name: Build downloader app
    needs: shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up signing keys
        run: |
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Build UnicaDownloader
        run: ./scripts/build_downloader_apk.sh

      - name: Upload UnicaDownloader
        uses: actions/upload-artifact@v4
        with:
          name: UnicaDownloader
          path: unica/mods/videodownloader/system/priv-app/UnicaDownloader/UnicaDownloader.apk
          if-no-files-found: error

  prayertimes:
    name: Build prayer times app
    needs: shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up signing keys
        run: |
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Build UnicaPrayerTimes
        run: |
          chmod +x ./scripts/build_prayertimes_apk.sh
          ./scripts/build_prayertimes_apk.sh

      - name: Upload UnicaPrayerTimes
        uses: actions/upload-artifact@v4
        with:
          name: UnicaPrayerTimes
          path: unica/mods/v_prayertimes/system/priv-app/UnicaPrayerTimes/UnicaPrayerTimes.apk
          if-no-files-found: error

  secretspace:
    name: Build secret space app
    needs: shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up signing keys
        run: |
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Build UnicaSecretSpace
        run: |
          chmod +x ./scripts/build_secretspace_apk.sh
          ./scripts/build_secretspace_apk.sh

      - name: Upload UnicaSecretSpace
        uses: actions/upload-artifact@v4
        with:
          name: UnicaSecretSpace
          path: unica/mods/v_secretspace/system/priv-app/UnicaSecretSpace/UnicaSecretSpace.apk
          if-no-files-found: error


  build:
    name: Build
    needs: [shellcheck, daemon, downloader, prayertimes, secretspace]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Download vc_daemon
        uses: actions/download-artifact@v4
        with:
          name: vc_daemon
          path: target/a52sxq/patches/00_voicechanger/system/bin

      - name: Download ca_daemon
        uses: actions/download-artifact@v4
        with:
          name: ca_daemon
          path: target/a52sxq/patches/01_callai/system/bin

      - name: Download UnicaDownloader
        uses: actions/download-artifact@v4
        with:
          name: UnicaDownloader
          path: unica/mods/videodownloader/system/priv-app/UnicaDownloader

      - name: Download UnicaPrayerTimes
        uses: actions/download-artifact@v4
        with:
          name: UnicaPrayerTimes
          path: unica/mods/v_prayertimes/system/priv-app/UnicaPrayerTimes

      - name: Download UnicaSecretSpace
        uses: actions/download-artifact@v4
        with:
          name: UnicaSecretSpace
          path: unica/mods/v_secretspace/system/priv-app/UnicaSecretSpace

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Forks have no signing secrets: leave the files empty so
          # IS_UNICA_CERT_AVAILABLE reports false and the AOSP keys are used.
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          chmod 755 target/a52sxq/patches/00_voicechanger/system/bin/vc_daemon
          chmod 755 target/a52sxq/patches/01_callai/system/bin/ca_daemon
          chmod 644 unica/mods/videodownloader/system/priv-app/UnicaDownloader/UnicaDownloader.apk
          chmod 644 unica/mods/v_prayertimes/system/priv-app/UnicaPrayerTimes/UnicaPrayerTimes.apk
          chmod 644 unica/mods/v_secretspace/system/priv-app/UnicaSecretSpace/UnicaSecretSpace.apk
          ./scripts/make_rom.sh --build-rom-zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-${{ matrix.target }}
          path: ${{ env.OUT_DIR }}/UN1CA_*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
